  <g data-step="3" transform="translate(608 38)"><rect class="panel" width="268" height="282" rx="20"/><text class="label" x="18" y="34">3 · Regresa estable</text><line class="ground" x1="24" y1="242" x2="244" y2="242"/><line class="support" x1="226" y1="55" x2="226" y2="242"/><circle class="head" cx="126" cy="70" r="20"/><path class="body" d="M126 92v80M126 118l95 31M126 118l-41 39M126 172l67 37 36 30M126 172l-51 67"/><circle class="heel" cx="193" cy="239" r="8"/><path class="move" d="M201 181h-35"/><path fill="#e46d51" d="m157 181 18 11v-22z"/></g>
