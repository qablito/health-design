  <g data-step="3" transform="translate(608 38)"><rect class="panel" width="268" height="282" rx="20"/><text class="label" x="18" y="34">3 · Empuja</text><line class="ground" x1="25" y1="246" x2="243" y2="246"/><path class="bench" d="M187 146h55v12h-55v84"/><circle class="head" cx="164" cy="116" r="18"/><path class="body" d="M147 129 67 191 41 238M147 129l41 24M188 153l-20 29"/><path class="move" d="M197 108 159 83"/><path fill="#e46d51" d="m151 78 10 18 12-18z"/></g>
