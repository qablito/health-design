<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="title desc">
  <title id="title">Remo con banda elástica</title>
  <desc id="desc">Tres pasos muestran una banda anclada al frente, los pies firmes y el tirón de los codos hacia atrás antes del retorno controlado.</desc>
  <style>.panel{fill:#fff;stroke:#d9dfd7;stroke-width:2}.body{fill:none;stroke:#173b36;stroke-width:8;stroke-linecap:round;stroke-linejoin:round}.head{fill:#b9d8cd;stroke:#173b36;stroke-width:4}.anchor{stroke:#54706b;stroke-width:7}.band{fill:none;stroke:#f3aa68;stroke-width:6;stroke-linecap:round}.grip{fill:#f3aa68;stroke:#173b36;stroke-width:3}.move{fill:none;stroke:#e46d51;stroke-width:5;stroke-linecap:round}.label{fill:#173b36;font:700 16px sans-serif}.ground{stroke:#9fb1ac;stroke-width:3}</style>
  <rect width="900" height="360" rx="28" fill="#f6f4ed"/>
  <g data-step="1" transform="translate(24 38)"><rect class="panel" width="268" height="282" rx="20"/><text class="label" x="18" y="34">1 · Banda al frente</text><line class="ground" x1="28" y1="246" x2="240" y2="246"/><line class="anchor" x1="235" y1="54" x2="235" y2="246"/><circle class="grip" cx="235" cy="130" r="7"/><circle class="head" cx="92" cy="76" r="21"/><path class="body" d="M98 99l10 80M102 126l84 4M108 179l-42 63M108 179l49 63"/><path class="band" d="M186 130h49"/><rect class="grip" x="177" y="122" width="16" height="16" rx="4"/></g>
  <g data-step="2" transform="translate(316 38)"><rect class="panel" width="268" height="282" rx="20"/><text class="label" x="18" y="34">2 · Codos atrás</text><line class="ground" x1="28" y1="246" x2="240" y2="246"/><line class="anchor" x1="235" y1="54" x2="235" y2="246"/><circle class="grip" cx="235" cy="130" r="7"/><circle class="head" cx="92" cy="76" r="21"/><path class="body" d="M98 99l10 80M102 126l-31 18 50 10M108 179l-42 63M108 179l49 63"/><path class="band" d="M121 154 235 130"/><rect class="grip" x="113" y="146" width="16" height="16" rx="4"/><path class="move" d="M190 91H132"/><path fill="#e46d51" d="m121 91 18 11V80z"/></g>
  <g data-step="3" transform="translate(608 38)"><rect class="panel" width="268" height="282" rx="20"/><text class="label" x="18" y="34">3 · Vuelve con control</text><line class="ground" x1="28" y1="246" x2="240" y2="246"/><line class="anchor" x1="235" y1="54" x2="235" y2="246"/><circle class="grip" cx="235" cy="130" r="7"/><circle class="head" cx="92" cy="76" r="21"/><path class="body" d="M98 99l10 80M102 126l84 4M108 179l-42 63M108 179l49 63"/><path class="band" d="M186 130h49"/><rect class="grip" x="177" y="122" width="16" height="16" rx="4"/><path class="move" d="M137 91h57"/><path fill="#e46d51" d="m205 91-18-11v22z"/></g>
</svg>
