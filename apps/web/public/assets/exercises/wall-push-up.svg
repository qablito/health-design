  <g data-step="3" transform="translate(608 38)"><rect class="panel" width="268" height="282" rx="20"/><text class="label" x="18" y="34">3 · Aleja la pared</text><line class="ground" x1="25" y1="246" x2="243" y2="246"/><line class="wall" x1="226" y1="54" x2="226" y2="246"/><circle class="head" cx="162" cy="86" r="20"/><path class="body" d="M154 108 105 176 69 240M105 176l73 58M154 120l69 30"/><path class="move" d="M197 95h-49"/><path fill="#e46d51" d="m139 95 18 11V84z"/></g>
