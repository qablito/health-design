<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="title desc">
  <title id="title">Remo con mancuerna y apoyo</title>
  <desc id="desc">Tres pasos laterales muestran una mano y una rodilla apoyadas en el banco, la mancuerna bajo el hombro y el codo subiendo junto al cuerpo.</desc>
