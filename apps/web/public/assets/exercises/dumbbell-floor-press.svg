<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="title desc">
  <title id="title">Press de suelo con mancuernas</title>
  <desc id="desc">Tres pasos laterales muestran la espalda y los pies apoyados, las mancuernas junto al pecho y su empuje vertical antes de bajar con control.</desc>
