  <g data-step="3" transform="translate(608 38)"><rect class="panel" width="268" height="282" rx="20"/><text class="label" x="18" y="34">3 · Gira a la derecha</text><path class="chair" d="M72 202h124M79 202v43M189 202v43"/><circle class="head" cx="152" cy="72" r="22"/><path class="body" d="M140 96l-6 91M91 121l103 18M91 121l97 49M188 137l-97 33M134 187l-48 15M134 187l48 15"/><ellipse class="pelvis" cx="134" cy="187" rx="27" ry="12"/><path class="move" d="M90 79c19-22 49-29 73-17"/><path fill="#e46d51" d="m172 67-19 7 3-20z"/></g>
