<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="title desc">
  <title id="title">Sentadilla goblet con mancuerna</title>
  <desc id="desc">Tres pasos muestran la mancuerna sujeta al pecho, el descenso estable entre los pies y el empuje para volver arriba.</desc>
