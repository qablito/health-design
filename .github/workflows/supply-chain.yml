name: Supply chain

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout complete history
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Configure pnpm
        uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5
        with:
          run_install: false
          version: 11.13.1

      - name: Configure Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          cache: pnpm
          node-version: 24.18.0

      - name: Install immutable dependencies
        run: pnpm install --frozen-lockfile

      - name: Scan worktree, history, lockfiles and release policy
        run: pnpm test:supply-chain

      - name: Scan vulnerable dependencies
        run: pnpm audit --audit-level high

  quality:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Configure pnpm
        uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5
        with:
          run_install: false
          version: 11.13.1

      - name: Configure Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          cache: pnpm
          node-version: 24.18.0

      - name: Install immutable dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium for the real browser contract test
        run: pnpm exec playwright install --with-deps chromium

      - name: Verify workspace
        run: pnpm verify

  edge:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Configure pnpm
        uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5
        with:
          run_install: false
          version: 11.13.1

      - name: Configure Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          cache: pnpm
          node-version: 24.18.0

      - name: Install immutable dependencies
        run: pnpm install --frozen-lockfile

      - name: Check generated Edge contract
        run: pnpm edge:check

      - name: Start Supabase local stack
        run: pnpm exec supabase start

      - name: Serve the runtime smoke function with JWT validation
        run: |
          pnpm exec supabase functions serve runtime-smoke > /tmp/runtime-smoke.log 2>&1 &
          echo $! > /tmp/runtime-smoke.pid
          sleep 3
          kill -0 "$(cat /tmp/runtime-smoke.pid)" || { cat /tmp/runtime-smoke.log; exit 1; }

      - name: Verify JWT and the Edge HTTP boundary
        run: EDGE_SMOKE_USE_LOCAL_ANON=true node scripts/edge-smoke.mjs

      - name: Show Edge logs on failure
        if: failure()
        run: cat /tmp/runtime-smoke.log || true

      - name: Stop Supabase local stack
        if: always()
        run: pnpm exec supabase stop --no-backup

  dependency-review:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Review dependency changes
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: high

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - edge
      - quality
      - security
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Configure pnpm
        uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5
        with:
          run_install: false
          version: 11.13.1

      - name: Configure Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          cache: pnpm
          node-version: 24.18.0

      - name: Install immutable dependencies
        run: pnpm install --frozen-lockfile

      - name: Build exact release artifact
        run: pnpm build

      - name: Scan the generated bundle before signing
        run: pnpm test:supply-chain

      - name: Generate and verify SBOM and release hashes
        run: pnpm supply-chain:artifacts

      - name: Verify release manifest again before signing
        run: node scripts/verify-supply-chain.mjs --verify-release

      - name: Attest build provenance
        id: provenance
        uses: actions/attest@36051bcae73b7c2a8a6945a48cbf80953c6baa35 # v4
        with:
          subject-path: apps/web/dist/**

      - name: Attest CycloneDX SBOM
        id: sbom
        uses: actions/attest@36051bcae73b7c2a8a6945a48cbf80953c6baa35 # v4
        with:
          sbom-path: artifacts/sbom.cdx.json
          subject-path: apps/web/dist/**

      - name: Verify signed provenance and SBOM attestations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          while IFS= read -r -d '' artifact; do
            gh attestation verify "$artifact" --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/supply-chain.yml" --signer-digest "$GITHUB_SHA" --source-digest "$GITHUB_SHA" --source-ref "$GITHUB_REF"
            gh attestation verify "$artifact" --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/supply-chain.yml" --signer-digest "$GITHUB_SHA" --source-digest "$GITHUB_SHA" --source-ref "$GITHUB_REF" --predicate-type https://cyclonedx.org/bom/v1.6
          done < <(find apps/web/dist -type f -print0)

      - name: Upload verifiable release bundle
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          if-no-files-found: error
          name: health-design-web-${{ github.sha }}
          path: |
            apps/web/dist/
            artifacts/release-manifest.json
            artifacts/sbom.cdx.json
