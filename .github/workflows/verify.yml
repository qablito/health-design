name: Verify

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Configure pnpm
        uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5
        with:
          run_install: false
          version: 11.13.1

      - name: Configure Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          cache: pnpm
          node-version: 24.18.0

      - name: Install immutable dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium for the real browser contract test
        run: pnpm exec playwright install --with-deps chromium

      - name: Verify workspace
        run: pnpm verify

      - name: Verify public environment boundary
        run: pnpm check:public-env

      - name: Verify Cloudflare bindings without deploying
        run: pnpm worker:check

  edge:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Configure pnpm
        uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5
        with:
          run_install: false
          version: 11.13.1

      - name: Configure Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          cache: pnpm
          node-version: 24.18.0

      - name: Install immutable dependencies
        run: pnpm install --frozen-lockfile

      - name: Check generated Edge contract
        run: pnpm edge:check

      - name: Start Supabase local stack
        run: pnpm exec supabase start

      - name: Rebuild database and synthetic seed
        run: pnpm exec supabase db reset

      - name: Verify profile membership and RLS
        run: pnpm test:db

      - name: Serve the runtime smoke function with JWT validation
        run: |
          pnpm exec supabase functions serve runtime-smoke > /tmp/runtime-smoke.log 2>&1 &
          echo $! > /tmp/runtime-smoke.pid
          sleep 3
          kill -0 "$(cat /tmp/runtime-smoke.pid)" || { cat /tmp/runtime-smoke.log; exit 1; }

      - name: Verify JWT and the Edge HTTP boundary
        run: EDGE_SMOKE_USE_LOCAL_ANON=true node scripts/edge-smoke.mjs

      - name: Show Edge logs on failure
        if: failure()
        run: cat /tmp/runtime-smoke.log || true

      - name: Stop Supabase local stack
        if: always()
        run: pnpm exec supabase stop --no-backup
