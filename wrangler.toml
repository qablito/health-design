name = "health-design-continuity-ledger"
main = "workers/continuity-ledger/src/index.js"
compatibility_date = "2026-07-17"
workers_dev = true
preview_urls = false

[triggers]
crons = ["*/5 * * * *"]

[exports.ContinuityLedger]
type = "durable-object"
storage = "sqlite"

[env.development]
name = "health-design-continuity-ledger-dev"
workers_dev = true
preview_urls = false

[env.development.vars]
ADMIN_AUDIT_KEK_VERSION = "1"
CONTINUITY_RECONCILER_URL = "https://nwoivdxdupklervtnovd.supabase.co/functions/v1/admin-reconciler/v1/admin-audit/reconcile"
ENVIRONMENT = "development"
LEDGER_SIGNING_KEY_VERSION = "1"
MUTATIONS_ENABLED = "true"
TOMBSTONE_HMAC_KEY_VERSION = "1"

[[env.development.durable_objects.bindings]]
name = "LEDGER"
class_name = "ContinuityLedger"

[[env.development.r2_buckets]]
binding = "DELETIONS_BUCKET"
bucket_name = "health-design-deletions-dev"
jurisdiction = "eu"

[[env.development.r2_buckets]]
binding = "ADMIN_AUDIT_BUCKET"
bucket_name = "health-design-admin-audit-dev"
jurisdiction = "eu"

[env.production]
name = "health-design-continuity-ledger-prod"
workers_dev = true
preview_urls = false

[env.production.vars]
ADMIN_AUDIT_KEK_VERSION = "1"
CONTINUITY_RECONCILER_URL = "https://rbfrpgafytexrarcfmmp.supabase.co/functions/v1/admin-reconciler/v1/admin-audit/reconcile"
ENVIRONMENT = "production"
LEDGER_SIGNING_KEY_VERSION = "1"
MUTATIONS_ENABLED = "false"
TOMBSTONE_HMAC_KEY_VERSION = "1"

[[env.production.durable_objects.bindings]]
name = "LEDGER"
class_name = "ContinuityLedger"

[[env.production.r2_buckets]]
binding = "DELETIONS_BUCKET"
bucket_name = "health-design-deletions-prod"
jurisdiction = "eu"

[[env.production.r2_buckets]]
binding = "ADMIN_AUDIT_BUCKET"
bucket_name = "health-design-admin-audit-prod"
jurisdiction = "eu"
